[tool.pixi.workspace]
name = "mlp-binary-classification"
version = "0.1.0"
description = "Titanic: Machine Learning from Disaster — MLP binary classification project"
authors = [
    "Maxim Selin (Mournweiss) <info@mournweiss.ru>",
]
license = "Apache-2.0"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.14"
numpy = ">=2.5.1"
pandas = ">=3.0.3"
scikit-learn = ">=1.9.0"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15.22"
mypy = ">=2.3.0"
pytest = ">=9.1.1"
black = ">=26.5.1"

[tool.pixi.feature.cuda.pypi-dependencies]
torch = { version = ">=2.13.0", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = ">=2.13.0", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.environments]
# Default: base dependencies + CUDA PyTorch
default = { features = ["cuda"], solve-group = "cuda" }
# Dev: base dependencies + dev tools + CUDA PyTorch
dev = { features = ["dev", "cuda"], solve-group = "cuda" }
# CPU: base dependencies + CPU PyTorch
cpu = { features = ["cpu"], solve-group = "cpu" }

[tool.pixi.tasks]
train = "python -m mlp_binary_classification.main --mode all"
train-eval = "python -m mlp_binary_classification.main --mode evaluate"
train-predict = "python -m mlp_binary_classification.main --mode predict"
test = "python -m pytest"
test-unit = "python -m pytest tests/unit"
test-integration = "python -m pytest tests/integration"
test-coverage = "python -m pytest --cov=src/mlp_binary_classification --cov-report=term-missing --cov-report=html"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "black ."
typecheck = "mypy src/"
install = "pixi install"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 88
target-version = ["py314"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # Line length handled by black
    "B008",   # Do not perform function call in argument defaults
    "SIM108", # Use ternary operator
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",   # Use of assert detected
    "PLR2004", # Magic value used in comparison
    "ANN001",  # Missing type annotation
]

[tool.ruff.lint.isort]
known-first-party = ["mlp_binary_classification"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "torch.*", "torch.nn.*", "torch.optim.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
